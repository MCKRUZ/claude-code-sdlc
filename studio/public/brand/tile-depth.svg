<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tōgō">
  <!-- The tile in Depth: the ground takes the gradient along the same light direction as the
       mark (top-left → bottom-right); bar and disc stay white. The app icon at 64 px and above;
       at 16 and 32 px the flat tile (tile.svg) is used, where a gradient would only be noise. -->
  <defs>
    <linearGradient id="depth" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#6FD1D4"/>
      <stop offset="1" stop-color="#0A3F47"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#depth)"/>
  <rect x="19" y="13" width="26" height="6" rx="3" fill="#FFFFFF"/>
  <circle cx="32" cy="38" r="15" fill="#FFFFFF"/>
</svg>
