<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tōgō">
  <!-- Mark A — Depth. One gradient in user space, bar top-left → disc bottom-right, so both
       shapes read as one object lit from one side. Light pair accent-300 → accent-900; the app
       swaps the dark pair (#6FD1D4 → #0E7C86) through its tokens. Hero and icon only, 48 px+. -->
  <defs>
    <linearGradient id="depth" gradientUnits="userSpaceOnUse" x1="17" y1="9" x2="47" y2="56">
      <stop offset="0" stop-color="#6FD1D4"/>
      <stop offset="1" stop-color="#0A3F47"/>
    </linearGradient>
  </defs>
  <rect x="17" y="9" width="30" height="7" rx="3.5" fill="url(#depth)"/>
  <circle cx="32" cy="38.5" r="17.5" fill="url(#depth)"/>
</svg>
