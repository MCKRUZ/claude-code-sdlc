template: incident-response
version: "1.0"

sections:
  - heading: Response Procedures
    fields:
      - label: Response Procedures
        anchor: section
        type: longtext
        required: true
        guidance: A Detect/Acknowledge/Diagnose/Communicate/Resolve/Confirm/Close procedure for each CRITICAL alert

  - heading: Escalation Matrix
    fields:
      - label: Escalation Matrix
        anchor: section
        type: table
        required: true
        guidance: Every severity level with named first responder, escalation target and time window, and after-hours policy

  - heading: Communication Templates
    fields:
      - label: Communication Templates
        anchor: section
        type: longtext
        required: true
        guidance: Initial notification, progress update, and resolution notice templates with channel, timing, and copy-paste-ready body

  - heading: Incident Classification
    fields:
      - label: Incident Classification
        anchor: section
        type: table
        required: false
        guidance: Each severity level with its definition, examples, and target response time

  - heading: Post-Incident Process
    fields:
      - label: Post-Incident Process
        anchor: section
        type: longtext
        required: false
        guidance: When a post-mortem is required and the post-mortem template - timeline, root cause, impact, what went well, what could be better, action items
