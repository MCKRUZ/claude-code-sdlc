template: project-retrospective
version: "1.0"

sections:
  - heading: What Went Well
    fields:
      - label: What Went Well
        anchor: section
        type: longtext
        required: true
        guidance: At least one specific observation each under Process, Technical, and Team/Collaboration — no platitudes

  - heading: What Didn't Work
    fields:
      - label: What Didn't Work
        anchor: section
        type: longtext
        required: true
        guidance: At least one specific observation each under Process, Technical, and Team/Collaboration — critique the system, not people

  - heading: Process Improvements
    fields:
      - label: Process Improvements
        anchor: section
        type: table
        required: true
        guidance: At least one concrete, actionable improvement with current state, proposed change, phase affected, and owner

  - heading: Technical Debt Log
    fields:
      - label: Technical Debt Log
        anchor: section
        type: table
        required: true
        guidance: Every known debt item with location, reason incurred, priority, and suggested fix timing

  - heading: Patterns to Reuse
    fields:
      - label: Patterns to Reuse
        anchor: section
        type: table
        required: false
        guidance: Decisions and approaches worth repeating on future projects, with why they worked and when to apply them

  - heading: Patterns to Avoid
    fields:
      - label: Patterns to Avoid
        anchor: section
        type: table
        required: false
        guidance: Decisions that created problems, what went wrong, and what to do instead

  - heading: Metrics Snapshot
    fields:
      - label: Metrics Snapshot
        anchor: section
        type: table
        required: false
        guidance: Final state of the project - phases completed, velocity, P0 stories delivered, coverage, defects, time to production

  - heading: Recommendations for Next Project
    fields:
      - label: Recommendations for Next Project
        anchor: section
        type: longtext
        required: false
        guidance: If you were starting this project over with what you know now, what would you do differently
