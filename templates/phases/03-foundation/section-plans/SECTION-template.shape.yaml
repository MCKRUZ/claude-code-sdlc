template: section-plan
version: "1.0"

sections:
  - heading: Goal
    fields:
      - label: Goal
        anchor: section
        type: text
        required: true
        guidance: One sentence — what capability does the system have when this section is complete that it didn't have before?

  - heading: Epics / Stories Covered
    fields:
      - label: Epics / Stories Covered
        anchor: section
        type: table
        required: false
        guidance: The epics and stories this section delivers, with their IDs, titles, and P-levels

  - heading: Entry Criteria
    fields:
      - label: Entry Criteria
        anchor: section
        type: checklist
        required: true
        guidance: What must be true before work on this section can begin?

  - heading: Exit Criteria
    fields:
      - label: Exit Criteria
        anchor: section
        type: checklist
        required: true
        guidance: Specific, verifiable conditions that mark this section complete — not "done when it works"

  - heading: Dependencies
    fields:
      - label: Dependencies
        anchor: section
        type: table
        required: false
        guidance: What this section depends on (another section or an external system), the type of dependency, and what specifically is needed

  - heading: Implementation Guidance
    fields:
      - label: Implementation Guidance
        anchor: section
        type: longtext
        required: true
        guidance: Key design decisions, patterns to follow, pitfalls to avoid — enough for the implementer to start without ambiguity

  - heading: Interfaces
    fields:
      - label: Interfaces
        anchor: section
        type: table
        required: false
        guidance: What this section exposes to other sections — each interface, whether it is internal or external, and the contract callers can expect

  - heading: Test Strategy
    fields:
      - label: Test Strategy
        anchor: section
        type: table
        required: false
        guidance: For each test type, what to test and the coverage target

  - heading: Risk
    fields:
      - label: Risk
        anchor: section
        type: table
        required: false
        guidance: Section-specific risks and how each will be handled

  - heading: Verification Criteria
    fields:
      - label: Verification Criteria
        anchor: section
        type: table
        required: false
        guidance: How each exit criterion will be verified — every criterion must be testable by an agent or human

  - heading: Evaluator Contract
    fields:
      - label: Evaluation scope
        anchor: inline
        type: text
        required: false
        guidance: What files, modules, or APIs are in scope for this section
      - label: Grading rubric
        anchor: labeled_block
        type: longtext
        required: false
        guidance: The numbered rubric the section evaluator agent grades against after implementation completes
      - label: Fail conditions (blocking)
        anchor: labeled_block
        type: longtext
        required: false
        guidance: Conditions that block the section from being accepted
      - label: Warn conditions (non-blocking)
        anchor: labeled_block
        type: longtext
        required: false
        guidance: Conditions that are flagged but do not block acceptance
