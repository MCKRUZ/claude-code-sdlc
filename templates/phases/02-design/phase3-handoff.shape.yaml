template: phase3-handoff
version: "1.0"
description: "What Foundation needs to know from Design before any code is written."

# "Implementation Breakdown for Planning" > "### Natural Section Boundaries" carries its
# REQUIRED marker on a ### subheading, not the ## heading itself — this shape format only
# recognizes fields within a "## " section span, so the whole "## Implementation Breakdown
# for Planning" section (covering all its ### subheadings) is modeled as one field.

sections:
  - heading: Design Summary
    fields:
      - label: Architecture pattern
        anchor: inline
        type: text
        required: true
        guidance: "Monolith / Microservices / Serverless / Plugin / Library / etc."
      - label: Primary technology decisions
        anchor: inline
        type: text
        required: true
        guidance: Language, framework, key dependencies
      - label: Total components
        anchor: inline
        type: number
        required: true
        guidance: Total component count
      - label: Total API endpoints
        anchor: inline
        type: number
        required: true
        guidance: Total API endpoint count
      - label: Date completed
        anchor: inline
        type: date
        required: true
        guidance: YYYY-MM-DD
      - label: Approved by
        anchor: inline
        type: text
        required: true
        guidance: Approver name

  - heading: Implementation Breakdown for Planning
    aliases: [Proposed Section Breakdown]
    fields:
      - label: Implementation Breakdown for Planning
        anchor: section
        type: longtext
        required: true
        guidance: Every section listed with its components, dependencies, and complexity estimate so Planning can assign sprints

  - heading: Decisions Locked in Design
    fields:
      - label: Decisions Locked in Design
        anchor: section
        type: table
        required: false
        guidance: Each decision made in Design, what was decided, the ADR that records it, and why
  - heading: Technical Risks for Planning to Address
    fields:
      - label: Technical Risks for Planning to Address
        anchor: section
        type: longtext
        required: false
        guidance: Risks with a mitigation strategy, plus the recommended spikes worth doing before committing to estimates
  - heading: Open Design Questions
    fields:
      - label: Open Design Questions
        anchor: section
        type: table
        required: false
        guidance: Questions not resolved in Design - what depends on each answer, who resolves it, and when
  - heading: Artifacts Produced in Design
    fields:
      - label: Artifacts Produced in Design
        anchor: section
        type: table
        required: false
        guidance: Each artifact Design produced, its status, and a note on what it covers
  - heading: Exit Gate Status
    fields:
      - label: Exit Gate Status
        anchor: section
        type: checklist
        required: false
        guidance: The Design exit-gate checklist, ending with the approver and approval date
