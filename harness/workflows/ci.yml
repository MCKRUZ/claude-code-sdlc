name: CI

# The CI rail (the-rails.md §3): secret scan + build + test + lint + coverage, plus the
# spec-gate — the mechanical, deterministic gate. This is a HARD BLOCK: any red here
# stops the merge. Nothing in this file calls an LLM; it answers only the questions a
# machine can answer definitively (is a secret committed, does it compile, do the tests
# pass, is coverage met, does a source PR carry its spec).
#
# ── PLACEHOLDERS (adapt per client, then delete this block) ────────────────────
#   <<BUILD_TOOLCHAIN>>   The setup-* action + version for your stack.
#                         Reference profile below uses .NET 10; swap for
#                         actions/setup-node, setup-java, setup-go, etc.
#   <<RESTORE_CMD>> / <<BUILD_CMD>> / <<TEST_CMD>>
#                         Your stack's commands. Reference values are dotnet.
#   <<SOLUTION_OR_PROJECT>>  Path to the solution/workspace/package manifest.
#   <<SERVICE_PROVISIONING>>  The `services:` block + any schema/seed steps your
#                         integration tests need (DB, cache, broker). The
#                         reference shows Postgres; DELETE the whole block if your
#                         tests need no external service.
#   <<COVERAGE_THRESHOLD>>   The standard's 80% coverage floor. ENFORCED by the
#                         "Enforce coverage floor" step below (COVERAGE_FLOOR env);
#                         change the value on the marked line, not in the runner.
#   <<SPEC_GATE_SRC_RE>>  Regex for what counts as source in the spec-gate job
#                         (default: ^src/). A PR matching it must carry a spec.
#   <<SPIKE_BRANCH_RE>>   Branch namespace reserved for spikes (default: ^spike/).
#                         The spike-guard job fails any PR opened from one.
#   <<TEST_ONLY_CMD>>     How to run ONLY the test files this PR adds, used by the
#                         repro-gate job to prove a bug-fix test fails without the fix.
#                         Reference is dotnet's --filter; swap for your runner's
#                         "run these files" flag (pytest <paths>, jest <paths>, …).
#   <<EVAL_GATE>>         OPTIONAL second hard gate for an agentic/eval fixture
#                         suite (the source repo's "OWASP Agentic Top-10 Gate").
#                         Keep it if you ship agent behavior that must not
#                         regress; DELETE the whole job otherwise.
# ───────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [ main ]   # <<DEFAULT_BRANCH>>
  pull_request:
    branches: [ main ]   # <<DEFAULT_BRANCH>>

jobs:
  build-and-test:
    name: build-and-test          # <-- required status-check context (branch-protection.json)
    runs-on: ubuntu-latest

    # <<SERVICE_PROVISIONING>> — provision the backing services your INTEGRATION
    # tests actually exercise, so they execute instead of silently skipping. The
    # credentials here must match whatever your test fixtures expect. Setting an
    # explicit connection env var (below) should also flip your fixtures into
    # "explicitly configured" mode, so a connectivity failure is a HARD error, not
    # a silent skip. DELETE this whole `services:`/`env:` pairing if not needed.
    services:
      database:
        image: postgres:16
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: appdb
          POSTGRES_PASSWORD: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appdb -d appdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Setting this both points tests at the service AND (by convention) makes the
      # fixture fail hard on a bad connection rather than skip. <<SERVICE_PROVISIONING>>
      TEST_DB_CONN: "Host=localhost;Port=5432;Database=appdb;Username=appdb;Password=appdb"

    steps:
      - uses: actions/checkout@v7

      # Secret scan (hard gate) — a committed credential is a fact; facts block.
      # Runs first: it needs no toolchain and a hit invalidates everything after it.
      # The binary is version- AND checksum-pinned (the standard's supply-chain rule:
      # no @latest, no unverified downloads). Scans the checked-out tree; history
      # scanning is a one-time onboarding task, not a per-PR gate.
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --no-banner --redact
          rm -f gitleaks gitleaks.tar.gz

      # <<BUILD_TOOLCHAIN>>
      - name: Setup toolchain
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # <<SERVICE_PROVISIONING>> — apply schema/seed the way your app would. GitHub
      # Actions service containers do NOT run an image's init scripts, so apply them
      # explicitly once the service is healthy. DELETE if no external service.
      - name: Apply database schema
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for f in db/init/*.sql; do
            echo "Applying $f"
            PGPASSWORD=appdb psql -h localhost -p 5432 -U appdb -d appdb -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Restore
        run: dotnet restore <<SOLUTION_OR_PROJECT>>          # <<RESTORE_CMD>>

      - name: Build
        run: dotnet build <<SOLUTION_OR_PROJECT>> --no-restore --configuration Release   # <<BUILD_CMD>>

      - name: Test with coverage
        # <<TEST_CMD>> — must FAIL the job on any failing test. Coverage is COLLECTED
        # here; the floor is enforced by the "Enforce coverage floor" step below. (The
        # XPlat collector cannot fail a run on a threshold — that is a coverlet.msbuild
        # feature, not a collector feature.)
        run: >
          dotnet test <<SOLUTION_OR_PROJECT>>
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory coverage

      # Coverage floor gate (<<COVERAGE_THRESHOLD>>). Parses every cobertura report the
      # collector produced and exits 1 if any line-rate is below the floor — a coverage
      # miss is a non-zero exit, never a passing run with a low number in a report the
      # pipeline ignores. Fails CLOSED when no report was produced. KEEP IN SYNC with
      # the ADO twin: packs/cicd/azure-devops/azure-pipelines/templates/dotnet-restore-build-test.yml.
      - name: Enforce coverage floor
        env:
          COVERAGE_FLOOR: '80'   # <<COVERAGE_THRESHOLD>>
        run: |
          set -euo pipefail
          FLOOR="$COVERAGE_FLOOR"
          found=0; fail=0
          while IFS= read -r report; do
            found=1
            rate="$(sed -n 's/.*<coverage[^>]*line-rate="\([0-9.]*\)".*/\1/p' "$report" | head -n1)"
            if [ -z "$rate" ]; then
              echo "::error::Could not read line-rate from $report"
              fail=1
              continue
            fi
            pct="$(awk -v r="$rate" 'BEGIN{printf "%.2f", r*100}')"
            if awk -v p="$pct" -v t="$FLOOR" 'BEGIN{exit !(p+0 < t+0)}'; then
              echo "::error::Coverage ${pct}% is below the ${FLOOR}% floor ($report)"
              fail=1
            else
              echo "Coverage ${pct}% >= ${FLOOR}% floor ($report)"
            fi
          done < <(find coverage -name 'coverage.cobertura.xml' 2>/dev/null)
          if [ "$found" -eq 0 ]; then
            echo "::error::No coverage.cobertura.xml produced — the coverage gate cannot pass without a report (fail closed)."
            exit 1
          fi
          exit "$fail"

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/

  # ── spec-gate ──────────────────────────────────────────────────────────────────
  # "No spec, no build" (the-rails.md §2), enforced deterministically. The grader
  # only WARNS when a PR carries no committed spec (grader.yml); this job BLOCKS:
  # a source change with no spec in the diff is a fact, and facts block. The
  # recorded escape is the `no-spec:chore` label + the reason in the PR description.
  # PR-only: push builds to the protected branch have no diff-vs-base to judge.
  spike-guard:
    name: spike-guard             # <-- required status-check context (branch-protection.json)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Refuse to merge spike code into the default branch
        env:
          SPIKE_RE: '^spike/'     # <<SPIKE_BRANCH_RE>> — branch namespace reserved for spikes
        run: |
          set -euo pipefail
          # A spike is bounded, throwaway work run to answer an unknown (build-loop.md §3a).
          # Its code has climbed NONE of the checking ladder — no spec to grade against, no
          # coverage bar, no Checker. The written finding is what leaves the branch; the code
          # is deleted. Rulesets target the DESTINATION branch and cannot express "reject this
          # source branch", so the throwaway rule is enforced here, as a required check.
          if printf '%s' "$GITHUB_HEAD_REF" | grep -qE "$SPIKE_RE"; then
            echo "::error::Spike branches never merge. '$GITHUB_HEAD_REF' is spike work."
            echo "A spike's deliverable is the written finding, not the code."
            echo "To comply:"
            echo "  1. Commit the finding (spikes/NNNN-name.md) on its own, off this branch."
            echo "  2. Delete this branch — the experiment is disposable by design."
            echo "  3. If the work should ship, write a spec and rebuild it under the loop."
            echo "There is no label escape for this gate. Rebuild under a spec instead."
            exit 1
          fi
          echo "OK: '$GITHUB_HEAD_REF' is not a spike branch."

  risk-signoff:
    name: risk-signoff            # <-- required status-check context (branch-protection.json)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: A HIGH-risk change needs a named human accepting the risk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RISK_LABEL: 'risk:high'
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The standard has always required this: on HIGH risk, a named human records a sentence
          # accepting the risk — "a person, by name, accepting the risk. Not a thumbs-up." It was
          # convention in a PR comment that nothing templated and nothing checked, which makes it
          # a rule that holds exactly as long as everyone remembers it.
          #
          # It is a CHECK rather than an artifact deliberately. A receipt committed under .sdlc/
          # would describe a merge that already happened; the acceptance has to exist BEFORE the
          # merge, which means it has to be at the merge.
          LABELS="$(gh pr view "$PR" --json labels --jq '.labels[].name' || true)"
          if ! printf '%s\n' "$LABELS" | grep -qx "$RISK_LABEL"; then
            echo "OK: not labelled $RISK_LABEL — no named sign-off required."
            exit 0
          fi

          # Body and comments both count; reviewers put it in either.
          HAYSTACK="$(
            gh pr view "$PR" --json body --jq '.body' || true
            gh pr view "$PR" --json comments --jq '.comments[].body' || true
          )"
          # SIGNED-OFF-BY: <name> — <sentence>. The sentence is required: a bare name is the
          # thumbs-up this gate exists to reject.
          # NOTE: no `\n` in the bracket expressions. In POSIX ERE that is a literal backslash and
          # the letter n, so `[^—–\n]` would silently exclude every name containing an "n" —
          # "Wes Carter" would pass this gate and "Dan Ruiz" would not. grep matches per line, so
          # the newline never needed excluding in the first place.
          if printf '%s' "$HAYSTACK" | grep -qiE '^[[:space:]>*-]*SIGNED-OFF-BY:[[:space:]]*[^[:space:]—–,:-][^—–]*[—–,:-]+[[:space:]]*[^[:space:]]'; then
            echo "OK: a named sign-off is recorded on this PR."
            exit 0
          fi

          echo "::error::This PR is labelled $RISK_LABEL and carries no named risk sign-off."
          echo "Add a comment in the form:"
          echo "    SIGNED-OFF-BY: Wes Carter — accepted: the carrier retry path is idempotent, verified in spike 0007"
          echo "A name with no sentence is a thumbs-up, and does not satisfy this gate."
          exit 1

  repro-gate:
    name: repro-gate              # <-- required status-check context (branch-protection.json)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prove a bug-fix test fails without the fix
        env:
          FIX_LABEL: 'type:bugfix'   # applied at triage when the spec's type is a bug fix
        run: |
          set -euo pipefail
          # WHY THIS GATE EXISTS: coverage proves a test EXISTS. It does not prove the test
          # would have CAUGHT the bug. A fix can satisfy an 80% floor with a test that passes
          # both before and after — decoration that burns review attention and protects
          # nothing, while every gate stays green. So for bug fixes we prove the negative:
          # the new test must FAIL against the code as it was before the fix.
          #
          # Scoped to bug fixes deliberately. A feature has no "before" state to fail against.
          if ! jq -e --arg l "$FIX_LABEL" '.pull_request.labels[]? | select(.name == $l)' "$GITHUB_EVENT_PATH" >/dev/null; then
            echo "OK: not labelled '$FIX_LABEL' — repro-gate does not apply to this PR."
            exit 0
          fi

          git fetch --no-tags origin "$GITHUB_BASE_REF"
          base="origin/${GITHUB_BASE_REF}"

          # Test files this PR adds or modifies. <<TEST_PATH_RE>> — adapt to your layout.
          new_tests="$(git diff --name-only --diff-filter=d "${base}...HEAD" \
            | grep -E '[Tt]ests?/.*\.(cs|py|ts|js|java|go)$' || true)"
          if [ -z "$new_tests" ]; then
            echo "::error::'$FIX_LABEL' PR carries no new or changed test."
            echo "A bug fix without a test that reproduces the bug is a fix nobody can prove."
            exit 1
          fi
          echo "Reproduction test(s) in this PR:"; printf '%s\n' "$new_tests" | sed 's/^/  - /'

          # Reconstruct the pre-fix state WITH the new tests: take the base tree, then apply
          # only the test files from this PR. If the suite still passes, the test does not
          # discriminate between broken and fixed — it is not a reproduction.
          work="$(mktemp -d)"
          git worktree add --detach "$work" "$base" >/dev/null
          # shellcheck disable=SC2086
          git checkout HEAD -- $new_tests
          for f in $new_tests; do
            mkdir -p "$work/$(dirname "$f")"
            git show "HEAD:$f" > "$work/$f"
          done

          cd "$work"
          set +e
          # <<TEST_ONLY_CMD>> — run ONLY the tests this PR adds. Reference: dotnet.
          dotnet test <<SOLUTION_OR_PROJECT>> --nologo --verbosity quiet
          rc=$?
          set -e
          cd - >/dev/null
          git worktree remove --force "$work" || true

          if [ "$rc" -eq 0 ]; then
            echo "::error::The new test PASSES without the fix — it does not reproduce the bug."
            echo "Rewrite it so it fails against the unpatched code, then push again."
            echo "There is no label escape: a test that cannot fail cannot protect anything."
            exit 1
          fi
          echo "OK: the new test fails without the fix (exit $rc) — it reproduces the bug."

  spec-gate:
    name: spec-gate               # <-- required status-check context (branch-protection.json)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history, so the diff against the base resolves

      - name: Require a spec in the diff for source changes
        env:
          SRC_RE: '^src/'         # <<SPEC_GATE_SRC_RE>> — what counts as source
          SPEC_DIR: specs         # <<SPEC_DIR>> — same directory grader.yml reads
        run: |
          set -euo pipefail
          # Recorded escape: the `no-spec:chore` PR label (for chores that genuinely
          # need no spec). Read from the event payload — no API call needed.
          if jq -e '.pull_request.labels[]? | select(.name == "no-spec:chore")' "$GITHUB_EVENT_PATH" >/dev/null; then
            echo "NOTICE: 'no-spec:chore' label present — spec-gate exemption recorded for this PR. State the reason in the PR description."
            exit 0
          fi
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          changed="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")"
          source_touched="$(printf '%s\n' "$changed" | grep -E "$SRC_RE" || true)"
          # New-or-modified spec files in this PR's diff (not deleted).
          # KEEP IN SYNC: this is the SAME regex grader.yml uses to identify the
          # committed spec file — change one, change both.
          spec_in_diff="$(git diff --name-only --diff-filter=d "origin/${GITHUB_BASE_REF}...HEAD" -- "${SPEC_DIR}/" \
            | grep -E "^${SPEC_DIR}/[0-9]+.*\.md$" || true)"
          if [ -n "$source_touched" ] && [ -z "$spec_in_diff" ]; then
            echo "::error::No spec, no build — this PR touches source but carries no committed spec."
            echo "Source files touched (match SRC_RE '${SRC_RE}'):"
            printf '%s\n' "$source_touched" | sed 's/^/  - /'
            echo "No ${SPEC_DIR}/NNNN-*.md file is in this PR's diff."
            echo "To comply: add or update the spec for this change under ${SPEC_DIR}/ so it rides in this PR."
            echo "Recorded escape: apply the 'no-spec:chore' label and state the reason in the PR description."
            exit 1
          fi
          if [ -z "$source_touched" ]; then
            echo "OK: not a source PR (nothing matches SRC_RE '${SRC_RE}') — spec-gate does not apply."
          else
            echo "OK: spec present in the diff: $(printf '%s\n' "$spec_in_diff" | head -n1)"
          fi

  # ── OPTIONAL: <<EVAL_GATE>> ────────────────────────────────────────────────────
  # A second HARD gate for projects that ship agentic behavior with an eval-fixture
  # suite that must not regress (the source repo gated the OWASP Agentic Top-10
  # fixtures here). Any failing fixture exits non-zero and BLOCKS the merge. A
  # legitimate, time-boxed bypass is RECORDED in .github/eval-bypasses.md (source:
  # profile/eval-bypasses.md) — the gate still runs; the ledger only documents why a
  # known failure was accepted.
  # DELETE this whole job if you have no such suite.
  eval-gate:
    name: eval-gate               # <-- required status-check context if kept
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore <<SOLUTION_OR_PROJECT>>

      - name: Build
        run: dotnet build <<SOLUTION_OR_PROJECT>> --no-restore --configuration Release

      - name: Run eval fixtures (hard gate)
        # Any failing eval fixture causes a non-zero exit and blocks the merge.
        # Document a legitimate bypass in .github/eval-bypasses.md (source:
        # profile/eval-bypasses.md); the gate still runs.
        run: >
          dotnet test <<EVAL_TEST_PROJECT>>
          --no-build
          --configuration Release
          --filter "<<EVAL_FILTER>>"
          --logger "trx;LogFileName=eval-gate.trx"
          --results-directory eval-results

      - name: Upload eval results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-gate-results
          path: eval-results/

  dependency-gate:
    name: dependency-gate         # <-- required status-check context (branch-protection.json)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    # ── THE STANDARD'S POSITION ON THIRD-PARTY COMPONENTS (GOLD-STANDARD §7) ───────────────
    # This gate blocks a PR that INTRODUCES a package with a known vulnerability. It does NOT
    # block on what was already there — the weekly dependency-scan workflow owns the standing
    # stock and raises an issue, which rides the normal rails as an ordinary spec.
    #
    # That split is the whole design. Every other gate here measures the diff; a vulnerability
    # scan measures the repo. Blocking on the repo would mean a CVE published overnight reddens
    # every open PR the next morning, for reasons nobody caused — the exact failure that
    # deploy-dev.yml argues against: a job red by design teaches the team red is normal, and
    # that degrades the signal on every OTHER job. Diff-scoping keeps this one meaningful.
    #
    # HOW: run the stack's scan against the BASE branch and against THIS branch, then compare
    # the two sets of findings. Set difference, not lockfile parsing — which is why one
    # mechanism serves .NET, Node and Python without this workflow knowing anything about any
    # of them. The normalizing is the stack pack's job (ci-profile.dependency_scan).
    #
    # BASE BRANCH TIP, not merge-base, deliberately: the question a merge gate answers is "what
    # will be true after this lands that is not true now". Merge-base gets that wrong the moment
    # someone merges main into their branch — inherited findings would be blamed on them.
    steps:
      - name: Checkout (full history — the base tree is scanned too)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # <<BUILD_TOOLCHAIN>> — the scan resolves dependencies itself, so no separate restore step.
      - name: Setup toolchain
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      # ── Scan THIS branch ────────────────────────────────────────────────────────────────────
      # The scan command is contracted (ci-profile.dependency_scan) to print one TSV finding per
      # line and EXIT 0 whether or not it finds anything. A non-zero exit therefore means the
      # TOOLING broke, not that the code is vulnerable — and those need different messages.
      - name: Scan this branch
        run: |
          set -uo pipefail
          # .NET reference value, verbatim from packs/stacks/dotnet/ci-profile.yaml
          # (dependency_scan.command). NOTE: this tool EXITS 0 even when it finds a High
          # advisory — the findings are in its OUTPUT, never its status. Verified 2026-07-31.
          if ! dotnet list package --vulnerable --include-transitive --format json --output-version 1 | jq -r '.projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | . as $p | ($p.vulnerabilities[]? | [.severity, $p.id, $p.resolvedVersion, .advisoryurl] | @tsv)' > "${RUNNER_TEMP}/head.tsv" 2> "${RUNNER_TEMP}/head.err"; then
            echo "::error title=Dependency scan failed::The scan of THIS branch did not complete, so this gate cannot tell whether the change introduces a vulnerable package. Failing closed rather than passing unverified."
            sed -n '1,40p' "${RUNNER_TEMP}/head.err" || true
            exit 1
          fi
          sort -u -o "${RUNNER_TEMP}/head.tsv" "${RUNNER_TEMP}/head.tsv"
          echo "Findings on this branch: $(wc -l < "${RUNNER_TEMP}/head.tsv")"

      # ── Scan the BASE branch, to establish what is NOT this change's doing ───────────────────
      - name: Scan the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          git fetch --no-tags --quiet origin "$BASE_REF"
          # A destructive checkout is fine here: this job exists only for the comparison, and
          # nothing after it reads the working tree.
          git checkout --quiet --detach "origin/$BASE_REF"
          if ! dotnet list package --vulnerable --include-transitive --format json --output-version 1 | jq -r '.projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | . as $p | ($p.vulnerabilities[]? | [.severity, $p.id, $p.resolvedVersion, .advisoryurl] | @tsv)' > "${RUNNER_TEMP}/base.tsv" 2> "${RUNNER_TEMP}/base.err"; then
            # Do NOT treat a broken baseline as "the base was clean". That would make every
            # pre-existing finding look newly introduced and bury the real one in a false storm.
            echo "::error title=Baseline scan failed::The scan of '$BASE_REF' did not complete, so this gate has no baseline. It cannot separate what this change introduced from what was already there."
            sed -n '1,40p' "${RUNNER_TEMP}/base.err" || true
            exit 1
          fi
          sort -u -o "${RUNNER_TEMP}/base.tsv" "${RUNNER_TEMP}/base.tsv"
          echo "Findings already on $BASE_REF: $(wc -l < "${RUNNER_TEMP}/base.tsv")"

      - name: Block on what this change introduced
        env:
          BLOCK_SEVERITIES: 'High,Critical'
          # An AUDITED manual override, exactly like correctness.yml's: who applied it is in the
          # PR timeline, and the ruleset's required non-author approval still gates the merge.
          # The label says a human decided; .github/dependency-exceptions.md says what they
          # decided and when that acceptance expires.
          HAS_ACCEPTED_RISK: ${{ contains(github.event.pull_request.labels.*.name, 'accepted-risk:dependency') }}
        run: |
          set -euo pipefail
          # In head, not in base. comm requires both inputs sorted; both were sorted above.
          comm -13 "${RUNNER_TEMP}/base.tsv" "${RUNNER_TEMP}/head.tsv" > "${RUNNER_TEMP}/new.tsv"

          if [ ! -s "${RUNNER_TEMP}/new.tsv" ]; then
            echo "OK: this change introduces no new vulnerable package."
            exit 0
          fi

          echo "New relative to the base branch:"
          cat "${RUNNER_TEMP}/new.tsv"

          # CASE-INSENSITIVE on purpose: .NET renders 'High', npm renders 'high'. A case-sensitive
          # match would silently match nothing on one of them — and a gate that matches nothing
          # passes forever. Verified against both tools' real output, 2026-07-31.
          awk -F'\t' -v list="$BLOCK_SEVERITIES" '
            BEGIN { n = split(tolower(list), a, /,/)
                    for (i = 1; i <= n; i++) { gsub(/^[ \t]+|[ \t]+$/, "", a[i]); block[a[i]] = 1 } }
            tolower($1) in block { print }
          ' "${RUNNER_TEMP}/new.tsv" > "${RUNNER_TEMP}/blocking.tsv"

          if [ ! -s "${RUNNER_TEMP}/blocking.tsv" ]; then
            echo "::warning title=New advisories below the blocking threshold::This change introduces packages with known advisories below $BLOCK_SEVERITIES. Reported, not blocked."
            exit 0
          fi

          echo "Blocking ($BLOCK_SEVERITIES):"
          while IFS=$'\t' read -r sev pkg ver url; do
            echo "  [$sev] $pkg $ver — $url"
          done < "${RUNNER_TEMP}/blocking.tsv"

          if [ "$HAS_ACCEPTED_RISK" = "true" ]; then
            echo "::warning::This change introduces a vulnerable package, but the 'accepted-risk:dependency' label records an accepted-risk override (audited in the PR timeline). Record the reason and an expiry in .github/dependency-exceptions.md. The branch ruleset's required non-author approval still gates the merge."
            exit 0
          fi

          echo "::error::This change introduces a package with a known $BLOCK_SEVERITIES vulnerability. Upgrade it, drop it, or apply the 'accepted-risk:dependency' label AND record the reason and expiry in .github/dependency-exceptions.md (audited; the merge still needs the ruleset's non-author approval)."
          exit 1
